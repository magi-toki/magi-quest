<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAGI QUEST — KimToki Birthday Celebration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: "PixelKR";
  src: url("fonts/Galmuri11.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "PixelEN";
  src: url("fonts/Galmuri11.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
  unicode-range: U+0000-024F, U+1E00-1EFF;
}

:root {
  --bg:#1c0e3d;
  --p1:#4b2a9c;
  --p2:#2c1668;
  --p3:#7a55d6;
  --pl:#c9a8ff;
  --y:#ffd23f;
  --r:#ff4f6d;
  --c:#5fe3ff;
  --ink:#120a2a;
  box-sizing:border-box;
  color-scheme:dark;
}

*,*::before,*::after {
  box-sizing:inherit;
  font-family:inherit;
}

button,input,textarea,select {
  font:inherit;
}

html {
  scroll-padding-top:env(safe-area-inset-top,0px);
}

body {
  margin:0;
  font-family:"DotGothic16",monospace;
  font-size:16px;
  line-height:1.7;
  color:#fff;
  background-color:var(--bg);
  background-image:linear-gradient(45deg,#24124d 25%,transparent 25%,transparent 75%,#24124d 75%),linear-gradient(45deg,#24124d 25%,transparent 25%,transparent 75%,#24124d 75%);
  background-size:16px 16px;
  background-position:0 0,8px 8px;
}

html[lang=ko] body {
  font-family:"PixelKR","DotGothic16",monospace;
}
html[lang=ja] body {
  font-family:"PixelEN","DotGothic16",monospace;
} 
  
[data-i] {
  white-space:pre-line;
}

.wrap {
  max-width:760px;
  margin:0 auto;
  padding:16px 16px 48px;
}

.sp {
  image-rendering:pixelated;
  display:inline-block;
  vertical-align:middle;
}

.c {
  text-align:center;
}

.y {
  color:var(--y);
}

.win {
  position:relative;
  margin:18px 0;
  padding:14px 16px;
  background:linear-gradient(var(--p1),var(--p2));
  box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff,inset 0 0 0 3px var(--p3),8px 10px 0 rgba(10,5,30,.55);
}

.win h2 {
  margin:0 0 8px;
  font-size:18px;
  font-weight:400;
  color:var(--y);
}

.btn {
  font:inherit;
  color:#fff;
  background:var(--p2);
  border:0;
  padding:6px 14px;
  margin:4px;
  cursor:pointer;
  box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff;
}

.btn:hover,.btn:focus-visible {
  background:var(--p3);
}

.btn:disabled {
  opacity:.4;
  cursor:default;
}

.btn[aria-pressed=true] {
  background:var(--y);
  color:var(--ink);
}

button:focus-visible {
  outline:3px dashed var(--y);
  outline-offset:5px;
}

#bar {
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:4px;
  padding:10px 12px;
  background:var(--ink);
}

#nav {
  display:flex;
  flex-wrap:wrap;
}

#nav[hidden] {
  display:none;
}

.lg {
  margin-left:auto;
}

h1 {
  margin:6px 0;
  font-size:clamp(34px,11vw,72px);
  font-weight:700;
  -webkit-text-stroke:1.15px var(--y);
  paint-order:stroke fill;
  line-height:1.1;
  color:var(--y);
  text-shadow:4px 4px 0 #a0309c,-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),6px 6px 0 var(--ink);
}

.kick {
  color:var(--pl);
  letter-spacing:.2em;
}

.row {
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  align-items:center;
}

.st {
  flex:1;
  min-width:200px;
}

.nm {
  font-size:30px;
  color:var(--y);
  line-height:1.2;
}

.stat {
  display:flex;
  align-items:center;
  gap:10px;
  margin:6px 0;
}

.stat b {
  font-weight:400;
  min-width:5.5em;
  text-align:right;
}

.bar {
  flex:1;
  min-width:80px;
  height:12px;
  background:var(--ink);
  box-shadow:0 0 0 2px #fff;
}

.bar i {
  display:block;
  height:100%;
  transition:width .3s steps(6);
}

.hp {
  background:repeating-linear-gradient(90deg,var(--r) 0 6px,transparent 6px 8px);
}

.mp {
  background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 8px);
}

.cmd {
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:none;
  border:0;
  color:#fff;
  font:inherit;
  font-size:18px;
  padding:10px 8px 10px 36px;
  position:relative;
  cursor:pointer;
}

.cmd::before {
  content:"";
  position:absolute;
  left:10px;
  top:50%;
  margin-top:-8px;
  border:8px solid transparent;
  border-left:12px solid var(--y);
  border-right:0;
  display:none;
}

.cmd:hover,.cmd:focus-visible {
  background:var(--p3);
  outline-offset:-3px;
}

.cmd:hover::before,.cmd:focus-visible::before {
  display:block;
  animation:bl .6s steps(2) infinite;
}

.tabs {
  display:flex;
  flex-wrap:wrap;
  margin:10px 0;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:18px;
  margin-top:14px;
}

.card {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  text-align:center;
  font:inherit;
  color:#fff;
  background:var(--p2);
  border:0;
  padding:14px 8px;
  cursor:pointer;
  box-shadow:0 -4px 0 #fff,0 4px 0 #fff,-4px 0 0 #fff,4px 0 0 #fff;
}

.card:hover,.card:focus-visible {
  background:var(--p3);
}

.ct {
  color:var(--y);
}

.ca {
  color:var(--pl);
  font-size:14px;
  margin:0;
}

/* 未閲覧作品の星マーク */
.unread-star {
  display:inline-block;
  color:var(--y);
  font-size:22px;
  line-height:1.2;
  text-shadow:0 0 7px rgba(255,210,63,.75);
  margin:2px 0 4px;
}

.unread-star[hidden] {
  display:none;
}

.tag {
  display:inline-block;
  padding:0 8px;
  font-size:12px;
  background:var(--ink);
  color:var(--c);
}

.tag.s {
  background:var(--r);
  color:#fff;
}

.note {
  font-size:14px;
  color:var(--pl);
}

.mo {
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  align-items:center;
  justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  background:rgba(10,5,30,.88);
  overflow:auto;
}

.mo.on {
  display:flex;
}

.mo .win {
  width:100%;
  max-width:560px;
  max-height:88vh;
  overflow:auto;
  margin:0;
}

.x {
  float:right;
}

.shake {
  animation:sh .3s steps(2) 3;
}

.glow {
  animation:bl .5s steps(2) infinite;
}

.novel {
  white-space:pre-wrap;
  max-height:40vh;
  overflow:auto;
  padding:10px;
  background:var(--ink);
}

.art {
  padding:10px;
  background:var(--ink);
}

.art img {
  max-width:100%;
  height:auto;
}

.talk {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:flex-end;
}

.dlg {
  flex:1;
  min-width:240px;
  margin:18px 0;
}

.dlg p {
  min-height:5.1em;
  margin:6px 0;
}

.who {
  color:var(--y);
}

.foot {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

@keyframes bl {
  50% {
    opacity:.35;
  }
}

@keyframes sh {
  0%,100% {
    transform:translateX(0);
  }
  25% {
    transform:translateX(-8px);
  }
  75% {
    transform:translateX(8px);
  }
}

/* HAPPY BIRTHDAY：文字ごとにランダム点滅 */
.blink-char {
  display:inline-block;
  animation:birthdayBlink var(--duration) steps(1,end) var(--delay) infinite;
  text-shadow:2px 0 #4b2a9c,-2px 0 #4b2a9c,0 2px #4b2a9c,0 -2px #4b2a9c,4px 4px 0 #120a2a;
  will-change:opacity,filter;
}

@keyframes birthdayBlink {
  0%,27%,52%,100% {
    opacity:1;
    filter:brightness(1);
  }
  28%,36% {
    opacity:.08;
    filter:brightness(.65);
  }
  37%,43% {
    opacity:1;
    filter:brightness(2.4) drop-shadow(0 0 7px #fff4a8);
  }
  44%,51% {
    opacity:.12;
    filter:brightness(.7);
  }
}

/* MAGI PARTY：押せるアイコン */
.party-row {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:3px;
}

.party-icon {
  display:inline-grid;
  place-items:center;
  min-width:42px;
  min-height:42px;
  padding:2px;
  border:2px solid transparent;
  background:transparent;
  cursor:pointer;
  vertical-align:middle;
}

.party-icon:hover {
  border-color:transparent;
  filter:brightness(1.3);
}

.party-icon:focus,.party-icon:focus-visible {
  outline:none;
  border-color:transparent;
  box-shadow:none;
}

.party-icon:active {
  transform:scale(.85);
}

.party-icon.party-pop {
  animation:partyPop .3s steps(3);
}

@keyframes partyPop {
  40% {
    transform:scale(1.3) rotate(-8deg);
  }
  75% {
    transform:scale(.9) rotate(5deg);
  }
}

.party-burst {
  position:fixed;
  z-index:100;
  pointer-events:none;
  animation:burst .75s ease-out forwards;
  font-size:20px;
  line-height:1;
  text-shadow:1px 1px #4b2a9c;
}

@keyframes burst {
  0% {
    opacity:0;
    transform:translate(0,0) scale(.4);
  }
  15% {
    opacity:1;
  }
  100% {
    opacity:0;
    transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.2);
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    scroll-behavior:auto!important;
  }
}

/* ===== SECRET PAGE ===== */
.secret-trigger {
  display:inline-block;
  width:22px;
  height:38px;
  margin-left:2px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
  vertical-align:middle;
}

.secret-trigger:focus-visible {
  outline:2px dashed var(--y);
  outline-offset:2px;
}

.secret-content {
  text-align:center;
  padding:30px 12px;
}

.secret-content h2 {
  color:var(--y);
  letter-spacing:.12em;
}

.secret-content p {
  line-height:2;
  margin:22px 0;
}

.secret-text {
  white-space:pre-line;
}

/* フッター */
.site-footer {
  text-align:center;
  padding:20px 10px;
  color:var(--pl);
  font-size:12px;
  letter-spacing:.08em;
}
</style>

</head>

<header id="bar">
 <div id="nav" hidden>

  <div class="secret-credit" data-i="secret_credit"></div>

 </div>
</section>
</main>

<footer class="site-footer">
 기획·제작　다윤 & nico
</footer>

<div class="mo" id="mo" role="dialog" aria-modal="true">
 <div class="win">
  <button class="btn x" id="mx" type="button" data-i="close"></button>
  <div id="mb"></div>
 </div>
</div>

/* ===== 効果音（iPhone / Safari 対応） ===== */
let audioCtx=null;
let masterGain=null;
let activeSounds=new Set();

function getAudio(){
 const AC=window.AudioContext||window.webkitAudioContext;

 if(!AC)return null;

 if(!audioCtx){
  audioCtx=new AC();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=0.9;
  masterGain.connect(audioCtx.destination);
 }

 return audioCtx;
}

function sound(freq,end,duration,volume=.025,type='square',delay=0){
 const ctx=getAudio();

 if(!ctx||!masterGain)return;

 const play=()=>{
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  const start=ctx.currentTime+delay;

  osc.type=type;
  osc.frequency.setValueAtTime(freq,start);
  osc.frequency.exponentialRampToValueAtTime(Math.max(30,end),start+duration);

  gain.gain.cancelScheduledValues(start);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(volume,start+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);

  osc.connect(gain);
  gain.connect(masterGain);

  activeSounds.add(osc);

  osc.onended=()=>{
   activeSounds.delete(osc);
   osc.disconnect();
   gain.disconnect();
  };

  osc.start(start);
  osc.stop(start+duration+.025);
 };

 if(ctx.state==='running'){
  play();
 }else{
  ctx.resume().then(()=>{
   if(ctx.state==='running')play();
  }).catch(error=>{
   console.warn('Audio could not start:',error);
  });
 }
}

/* 再生中の音をすべて停止 */
function stopAllSounds(){
 activeSounds.forEach(osc=>{
  try{
   osc.stop();
  }catch(e){}
 });

 activeSounds.clear();
}

/* ===== 飛び出すハート・花火 ===== */
function burstFrom(button){
 const rect=button.getBoundingClientRect();
 const x=rect.left+rect.width/2;
 const y=rect.top+rect.height/2;

 const symbols=['♥','♡','✦','★','✧','✹'];
 const colors=['#ff91c8','#ffe17a','#bda7ff','#9ee8d1'];

 for(let i=0;i<12;i++){
  const p=document.createElement('span');

  p.className='party-burst';
  p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  p.style.left=x+'px';
  p.style.top=y+'px';
  p.style.color=colors[i%colors.length];

  const angle=Math.PI*2*i/12;
  const distance=40+Math.random()*55;

  p.style.setProperty('--dx',Math.cos(angle)*distance+'px');
  p.style.setProperty('--dy',(Math.sin(angle)*distance-20)+'px');
  p.style.setProperty('--rot',(Math.random()*100-50)+'deg');

  document.body.appendChild(p);
  p.addEventListener('animationend',()=>p.remove(),{once:true});
 }

 button.classList.remove('party-pop');
 void button.offsetWidth;
 button.classList.add('party-pop');
}

document.querySelectorAll('.party-icon').forEach(button=>{
 button.addEventListener('click',()=>{
  playPew();
  burstFrom(button);
 });
});

/* ===== タイトルのランダム点滅 ===== */
function birthdayBlink(){
 const heading=document.querySelector('#v-top h1');

 if(!heading||heading.dataset.blinkReady)return;

 heading.dataset.blinkReady='true';

 const lines=heading.innerHTML.split('<br>');
 heading.innerHTML='';

 lines.forEach((line,index)=>{
  [...line].forEach(char=>{
   const span=document.createElement('span');

   span.className='blink-char';
   span.textContent=char;
   span.style.setProperty('--delay',Math.random()*2.5+'s');
   span.style.setProperty('--duration',(1.8+Math.random()*2.2)+'s');

   heading.appendChild(span);
  });

  if(index<lines.length-1){
   heading.appendChild(document.createElement('br'));
  }
 });
}
